name: Build and push self-host image

# Builds the Documenso image from this fork (including the Croatian
# translation) and pushes it to GHCR, so low-spec servers can just pull
# instead of building locally.

on:
  push:
    branches: [main]
    # Skip docs-only churn; the image does not change for those.
    paths-ignore:
      - '**.md'
      - 'apps/docs/**'
  workflow_dispatch:

env:
  # GHCR requires an all-lowercase image name; the owner here is mixed case.
  IMAGE: ghcr.io/lordtony1/documenso

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up runner disk space
        # The default runner has ~14 GB free, which this monorepo build can
        # exhaust. Dropping preinstalled toolchains we do not use reclaims
        # roughly 20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Server is x86_64; building arm64 too would roughly double runtime.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTE: deliberately no encryption-key build args. Those ARGs exist
          # only in the Dockerfile's installer stage and never reach the final
          # image; real values are supplied at runtime via compose env. Passing
          # them here would bake secrets into a public image layer.
