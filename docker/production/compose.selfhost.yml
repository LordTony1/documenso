name: documenso-selfhost

# Self-hosted Documenso behind a Cloudflare Tunnel.
#
# Differs from compose.yml in three ways:
#   1. Builds the image from THIS repo instead of pulling documenso/documenso:latest
#      (the official image does not contain the Croatian translation).
#   2. Publishes no host ports — cloudflared reaches the app over the internal
#      Docker network, so nothing is exposed on the server's public interface.
#   3. Adds the cloudflared service.

services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data

  documenso:
    # Image built from THIS fork by .github/workflows/build-image.yml.
    # The official documenso/documenso image has no Croatian translation.
    #
    # To build on the server instead of pulling, comment out `image:` and
    # uncomment the `build:` block below (needs ~4 GB RAM and ~10 GB disk).
    image: ghcr.io/lordtony1/documenso:latest
    # build:
    #   context: ../..
    #   dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      - PORT=${PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?err}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${NEXT_PRIVATE_ENCRYPTION_KEY:?err}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY:?err}
      # Must be the PUBLIC https URL served by the tunnel, not localhost.
      # Signing links emailed to recipients are built from this value.
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:?err}
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=${NEXT_PRIVATE_INTERNAL_WEBAPP_URL:-http://localhost:${PORT:-3000}}
      - NEXT_PRIVATE_DATABASE_URL=${NEXT_PRIVATE_DATABASE_URL:?err}
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=${NEXT_PRIVATE_DIRECT_DATABASE_URL:-${NEXT_PRIVATE_DATABASE_URL}}
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=${NEXT_PUBLIC_UPLOAD_TRANSPORT:-database}
      - NEXT_PRIVATE_SMTP_TRANSPORT=${NEXT_PRIVATE_SMTP_TRANSPORT:?err}
      - NEXT_PRIVATE_SMTP_HOST=${NEXT_PRIVATE_SMTP_HOST}
      - NEXT_PRIVATE_SMTP_PORT=${NEXT_PRIVATE_SMTP_PORT}
      - NEXT_PRIVATE_SMTP_USERNAME=${NEXT_PRIVATE_SMTP_USERNAME}
      - NEXT_PRIVATE_SMTP_PASSWORD=${NEXT_PRIVATE_SMTP_PASSWORD}
      - NEXT_PRIVATE_SMTP_SECURE=${NEXT_PRIVATE_SMTP_SECURE}
      - NEXT_PRIVATE_SMTP_FROM_NAME=${NEXT_PRIVATE_SMTP_FROM_NAME:?err}
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=${NEXT_PRIVATE_SMTP_FROM_ADDRESS:?err}
      - NEXT_PRIVATE_RESEND_API_KEY=${NEXT_PRIVATE_RESEND_API_KEY}
      - NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT=${NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${NEXT_PUBLIC_DISABLE_SIGNUP}
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=${NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH:-/opt/documenso/cert.p12}
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=${NEXT_PRIVATE_SIGNING_PASSPHRASE}
    volumes:
      # The host file MUST exist before the first `up`. If it does not, Docker
      # silently creates a DIRECTORY at this path and signing breaks.
      - ${NEXT_PRIVATE_SIGNING_HOST_CERT_PATH:-/opt/documenso/cert.p12}:/opt/documenso/cert.p12:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # cloudflared resolves the Cloudflare edge IPs ONCE at process start and
    # never re-resolves. On a host reboot it can win the race against the LAN
    # router's DNS forwarder, which then answers the edge lookup with its own
    # address — cloudflared caches that and retries a dead IP forever, serving
    # Cloudflare error 1033 until the container is restarted by hand. Happened
    # 2026-07-30. Public resolvers here keep edge discovery independent of the
    # router's boot timing; a failed lookup is retried, a poisoned one is not.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?err}
    depends_on:
      - documenso

volumes:
  database:
